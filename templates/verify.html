{% extends "base.html" %}
{% block content %}
<section class="card auth-card">
  <h1>Access Gate</h1>
  <p>Solve this quick captcha to enter:</p>
  <form method="post" class="stack">
    <label>{{ question }} = ?</label>
    <input name="answer" type="text" required autocomplete="off" />
    <button type="submit">Verify</button>
  </form>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
</section>
{% endblock %}
